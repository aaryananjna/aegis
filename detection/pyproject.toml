[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hangup-detect"
version = "0.1.0"
description = "Scam tactic detection for Hang Up"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["hangup_detect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
