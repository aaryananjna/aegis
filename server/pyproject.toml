[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-server"
version = "0.1.0"
description = "Aegis server (role A): sessions, WebSockets, live captions"
requires-python = ">=3.11"
# B's detector is installed separately: pip install -e detection
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "asyncpg>=0.29",
    "websockets>=13",
    "certifi",
    "argon2-cffi>=23.1",
]

# Laptop mic for live captions: pip install -e "server[mic]"
[project.optional-dependencies]
mic = ["sounddevice>=0.4"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["aegis_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
